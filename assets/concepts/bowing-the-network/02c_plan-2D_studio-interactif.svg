<text x="687.0" y="332.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="bold">Configuration minimale :</text>
<text x="687.0" y="350.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• 1 LiDAR S2E (déplacements)</text>
<text x="687.0" y="366.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• 1 nœud Puara sur l'archet</text>
<text x="687.0" y="382.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• 3 micros (DPA, Fishman, C411), sans fil</text>
<text x="687.0" y="398.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• (câble long en secours)</text>
<text x="687.0" y="414.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• 1 ordinateur</text>
<text x="687.0" y="430.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• haut-parleurs de la SAT</text>
<text x="687.0" y="446.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• Extensions : Femto Mega de côté</text>
<text x="687.0" y="462.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• (gestes fins), Femto Mega au-dessus</text>
<text x="687.0" y="478.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">• (vérification de la position)</text>
<text x="687.0" y="512.0" font-size="11" fill="#3a9a8a" text-anchor="start" font-weight="bold">Un seul interprète, une seule surface :</text>
<text x="687.0" y="527.0" font-size="11" fill="#3a9a8a" text-anchor="start" font-weight="normal">pas de triangulation ; chaque capteur</text>
<text x="687.0" y="542.0" font-size="11" fill="#3a9a8a" text-anchor="start" font-weight="normal">a un rôle distinct (déplacements,</text>
<text x="687.0" y="557.0" font-size="11" fill="#3a9a8a" text-anchor="start" font-weight="normal">gestes fins, vérification par le dessus).</text>
