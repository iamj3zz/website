<text x="36.0" y="120.0" font-size="13" fill="#3f7fbf" text-anchor="start" font-weight="bold">⑤ DPA 4099 — col de cygne aérien</text>
<text x="36.0" y="136.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">pincé sur le côté du violon (éclisse, côté grave),</text>
<text x="36.0" y="152.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">vise l'ouïe côté grave ;</text>
<text x="36.0" y="168.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">son naturel diffusé et matière des traces</text>
<circle cx="690" cy="290" r="9" fill="#6b7280" stroke="#fff" stroke-width="2"/>
<line x1="690" y1="290" x2="640" y2="120" stroke="#6b7280" stroke-width="1.5"/>
<text x="634.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="end" font-weight="bold">⑥ Liaison sans fil, 3 canaux (ceinture) — à explorer</text>
<text x="634.0" y="136.0" font-size="11" fill="#1d2025" text-anchor="end" font-weight="normal">les trois micros vers la régie pour jouer en marchant ;</text>
<text x="634.0" y="152.0" font-size="11" fill="#1d2025" text-anchor="end" font-weight="normal">latence et fiabilité étudiées ; câble long en secours</text>
