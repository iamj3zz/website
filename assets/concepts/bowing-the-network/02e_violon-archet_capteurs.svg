<text x="876.0" y="556.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">sur la table, près du chevalet (pâte amovible)</text>
<text x="876.0" y="572.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">résonance de la caisse : modes de jeu</text>
<text x="876.0" y="588.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">(col legno, frappes, sul ponticello)</text>
