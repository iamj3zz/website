<text x="1164.0" y="230.0" font-size="13" fill="#b0662e" text-anchor="end" font-weight="bold">② Nœud Puara — volute (extension)</text>
<text x="1164.0" y="246.0" font-size="11" fill="#1d2025" text-anchor="end" font-weight="normal">ESP32 + centrale inertielle, fixation amovible</text>
<text x="1164.0" y="262.0" font-size="11" fill="#1d2025" text-anchor="end" font-weight="normal">orientation du violon ; angle archet/violon</text>
<text x="1164.0" y="278.0" font-size="11" fill="#1d2025" text-anchor="end" font-weight="normal">→ corde jouée</text>
