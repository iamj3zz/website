<text x="626.0" y="600.0" font-size="13" fill="#3f7fbf" text-anchor="start" font-weight="bold">③ Fishman — piézo dans le chevalet</text>
<text x="626.0" y="616.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">signal d'analyse principal : hauteur, attaques ;</text>
<text x="626.0" y="632.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">presque insensible aux haut-parleurs</text>
