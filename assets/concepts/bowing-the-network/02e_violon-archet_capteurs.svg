<text x="36.0" y="600.0" font-size="13" fill="#b0662e" text-anchor="start" font-weight="bold">① Nœud Puara — archet</text>
<text x="36.0" y="616.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">ESP32 + centrale inertielle 9 axes + batterie,</text>
<text x="36.0" y="632.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">dans ou contre la hausse (talon) ; Wi-Fi, OSC</text>
<text x="36.0" y="648.0" font-size="11" fill="#1d2025" text-anchor="start" font-weight="normal">vitesse, sens, inclinaison, changements d'archet</text>
